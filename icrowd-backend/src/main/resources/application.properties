spring.application.name=icrowd-backend

# H2 In-Memory Database (For local testing without installing PostgreSQL)
spring.datasource.url=jdbc:h2:mem:icrowddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL Configuration (Commented out until ready for production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/icrowd
# spring.datasource.username=postgres
# spring.datasource.password=password
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration
server.port=8080
